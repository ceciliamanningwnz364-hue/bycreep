name: bycreep

options:
  bundleIdPrefix: com.bycreep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  bycreep:
    type: application
    platform: iOS
    sources:
      - path: bycreep
        excludes:
          - "Info.plist"
          - "bycreep.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: bycreep
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app
        INFOPLIST_FILE: bycreep/Info.plist
        CODE_SIGN_ENTITLEMENTS: bycreep/bycreep.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: bycreepWidgetExtension
        embed: true

  bycreepWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: bycreepWidget
        excludes:
          - "Info.plist"
          - "bycreepWidget.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: bycreepWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app.widget
        INFOPLIST_FILE: bycreepWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: bycreepWidget/bycreepWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  bycreep:
    build:
      targets:
        bycreep: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
